name: Sprint 7 identity account link

on:
  push:
    branches:
      - sprint7/mobile-identity-verification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7/mobile-identity-verification
      - name: Add account shortcut
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/mobile/src/app/account.tsx')
          text = path.read_text()
          needle = '''        <AppButton\n          label="Conversas"\n          onPress={() => router.push("/conversations")}\n          variant="secondary"\n        />'''
          replacement = '''        <AppButton\n          label="Verificação de identidade"\n          onPress={() => router.push("/identity-verification")}\n          variant="secondary"\n        />\n        <AppButton\n          label="Conversas"\n          onPress={() => router.push("/conversations")}\n          variant="secondary"\n        />'''
          if replacement in text:
              raise SystemExit(0)
          if needle not in text:
              raise SystemExit('account shortcut insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
      - name: Commit account shortcut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/app/account.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(mobile): link identity verification from account"
          git push origin HEAD:sprint7/mobile-identity-verification
