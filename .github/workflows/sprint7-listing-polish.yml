name: Sprint 7 listing polish

on:
  push:
    branches:
      - sprint7/mobile-listing-management

permissions:
  contents: write

jobs:
  polish:
    if: github.event.head_commit.message == 'ci(mobile): add temporary listing polish workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7/mobile-listing-management
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch account shortcut and React type import
        shell: python
        run: |
          from pathlib import Path

          account = Path('apps/mobile/src/app/account.tsx')
          text = account.read_text()
          needle = '''        <AppButton\n          label="Verificação de identidade"\n          onPress={() => router.push("/identity-verification")}\n          variant="secondary"\n        />'''
          replacement = needle + '''\n        <AppButton\n          label="Meus anúncios"\n          onPress={() => router.push("/my-listings")}\n          variant="secondary"\n        />'''
          if 'label="Meus anúncios"' not in text:
              if needle not in text:
                  raise SystemExit('account shortcut insertion point not found')
              account.write_text(text.replace(needle, replacement, 1))

          editor = Path('apps/mobile/src/app/listing-editor.tsx')
          text = editor.read_text()
          text = text.replace(
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useState, type ComponentProps } from "react";',
          )
          text = text.replace(
              'function Field(props: React.ComponentProps<typeof TextInput> & { label: string }) {',
              'function Field(props: ComponentProps<typeof TextInput> & { label: string }) {',
          )
          editor.write_text(text)
      - run: pnpm --filter @morada/mobile exec prettier --write "src/**/*.{ts,tsx}"
      - name: Commit polish and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sprint7-listing-polish.yml
          git add apps/mobile/src
          git commit -m "style(mobile): polish advertiser flow"
          git push origin HEAD:sprint7/mobile-listing-management
