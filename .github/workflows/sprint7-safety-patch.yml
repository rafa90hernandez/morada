name: Sprint 7 safety patch

on:
  push:
    branches:
      - sprint7/mobile-safety-communication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7/mobile-safety-communication
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch safety affordances
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/mobile/src/app/conversations/[id].tsx')
          text = path.read_text()

          anchor = '''import { AppButton } from "@/components/ui/AppButton";'''
          replacement = '''import { AppButton } from "@/components/ui/AppButton";\nimport {\n  blockUser,\n  listOwnBlocks,\n  unblockUser,\n} from "@/api/safety";'''
          text = text.replace(anchor, replacement, 1)

          anchor = '''  const [contactUnavailable, setContactUnavailable] = useState(false);'''
          replacement = '''  const [contactUnavailable, setContactUnavailable] = useState(false);\n  const [ownBlock, setOwnBlock] = useState(false);\n  const [workingSafety, setWorkingSafety] = useState(false);'''
          text = text.replace(anchor, replacement, 1)

          anchor = '''      const [conversationResult, messageResult, allVisits] = await Promise.all([\n        getConversation(params.id, accessToken),\n        listMessages(params.id, accessToken),\n        listVisits(accessToken),\n      ]);'''
          replacement = '''      const [conversationResult, messageResult, allVisits, ownBlocks] =\n        await Promise.all([\n          getConversation(params.id, accessToken),\n          listMessages(params.id, accessToken),\n          listVisits(accessToken),\n          listOwnBlocks(accessToken),\n        ]);'''
          text = text.replace(anchor, replacement, 1)

          anchor = '''      setConversation(conversationResult);\n      setContactUnavailable(conversationResult.status !== "ACTIVE");'''
          replacement = '''      setConversation(conversationResult);\n      setContactUnavailable(conversationResult.status !== "ACTIVE");\n      const otherUserId =\n        conversationResult.participantA.id === currentUserId\n          ? conversationResult.participantB.id\n          : conversationResult.participantA.id;\n      setOwnBlock(ownBlocks.some((block) => block.blockedId === otherUserId));'''
          text = text.replace(anchor, replacement, 1)

          anchor = '''  const send = async () => {'''
          block_code = '''  const toggleBlock = async () => {\n    if (!accessToken || !counterpart) return;\n    setWorkingSafety(true);\n    setError(null);\n    try {\n      if (ownBlock) {\n        await unblockUser(counterpart.id, accessToken);\n      } else {\n        await blockUser(counterpart.id, accessToken);\n        setContactUnavailable(true);\n        setLocations({});\n      }\n      await load();\n    } catch (blockError) {\n      if (statusOf(blockError) === 401) {\n        router.replace("/login");\n        return;\n      }\n      setError("Não foi possível atualizar o bloqueio agora.");\n    } finally {\n      setWorkingSafety(false);\n    }\n  };\n\n  const reportConversation = () => {\n    if (!counterpart) return;\n    router.push({\n      pathname: "/report",\n      params: {\n        reportedUserId: counterpart.id,\n        listingId: conversation?.listing.id,\n        conversationId: params.id,\n        context: "esta conversa",\n      },\n    });\n  };\n\n  const reportMessage = (message: Message) => {\n    if (!counterpart) return;\n    router.push({\n      pathname: "/report",\n      params: {\n        reportedUserId: message.senderId,\n        listingId: conversation?.listing.id,\n        conversationId: params.id,\n        context: "esta mensagem",\n      },\n    });\n  };\n\n  const send = async () => {'''
          text = text.replace(anchor, block_code, 1)

          anchor = '''      </View>\n\n      {contactUnavailable ? ('''
          replacement = '''      </View>\n\n      <View style={styles.sectionCard}>\n        <Text style={styles.sectionTitle}>Segurança e privacidade</Text>\n        <Text style={styles.mutedLeft}>\n          Denúncias são sinais para análise, não prova automática. Bloqueios\n          impedem novo contato e acesso futuro ao endereço exato de visitas,\n          mas o histórico desta conversa permanece visível.\n        </Text>\n        <AppButton\n          disabled={workingSafety || !counterpart}\n          label={\n            workingSafety\n              ? "Atualizando..."\n              : ownBlock\n                ? "Desbloquear usuário"\n                : "Bloquear usuário"\n          }\n          onPress={() => void toggleBlock()}\n          variant="secondary"\n        />\n        <AppButton\n          disabled={!counterpart}\n          label="Denunciar conversa"\n          onPress={reportConversation}\n          variant="secondary"\n        />\n      </View>\n\n      {contactUnavailable ? ('''
          text = text.replace(anchor, replacement, 1)

          anchor = '''                <Text style={styles.messageTime}>\n                  {new Date(message.createdAt).toLocaleString("pt-BR")}\n                </Text>'''
          replacement = '''                <Text style={styles.messageTime}>\n                  {new Date(message.createdAt).toLocaleString("pt-BR")}\n                </Text>\n                {!mine ? (\n                  <Pressable\n                    accessibilityRole="button"\n                    onPress={() => reportMessage(message)}\n                  >\n                    <Text style={styles.reportLink}>Denunciar mensagem</Text>\n                  </Pressable>\n                ) : null}'''
          text = text.replace(anchor, replacement, 1)

          anchor = '''  messageTime: {\n    color: colors.textMuted,\n    fontSize: 11,\n  },'''
          replacement = '''  messageTime: {\n    color: colors.textMuted,\n    fontSize: 11,\n  },\n  reportLink: {\n    color: colors.danger,\n    fontSize: 12,\n    fontWeight: "700",\n  },'''
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          path = Path('apps/mobile/src/app/listing/[id].tsx')
          text = path.read_text()
          anchor = '''        <AppButton\n          disabled={favoriteLoading}\n          label={'''
          report_button = '''        <AppButton\n          label={session ? "Denunciar anúncio" : "Entrar para denunciar"}\n          onPress={() => {\n            if (!session) {\n              router.push({\n                pathname: "/login",\n                params: { returnTo: `/listing/${params.id}` },\n              });\n              return;\n            }\n            router.push({\n              pathname: "/report",\n              params: { listingId: params.id, context: "este anúncio" },\n            });\n          }}\n          variant="secondary"\n        />\n        <AppButton\n          disabled={favoriteLoading}\n          label={'''
          text = text.replace(anchor, report_button, 1)
          path.write_text(text)

          path = Path('apps/mobile/src/app/_layout.tsx')
          text = path.read_text()
          anchor = '''        <Stack.Screen name="favorites" options={{ title: "Favoritos" }} />'''
          replacement = '''        <Stack.Screen name="favorites" options={{ title: "Favoritos" }} />\n        <Stack.Screen name="report" options={{ title: "Denunciar" }} />'''
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
      - run: pnpm --filter @morada/mobile exec prettier --write "src/**/*.{ts,tsx}"
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sprint7-safety-patch.yml
          git add apps/mobile/src
          git commit -m "feat(mobile): complete safety and block affordances"
          git push origin HEAD:sprint7/mobile-safety-communication
