name: Wire message attachments
on:
  push:
    branches: [beta1/mobile-message-attachments]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/wire-message-attachments.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/app/conversations/'[id].tsx'
          git diff --cached --quiet && exit 0
          git commit -m "feat(mobile): wire private conversation attachments"
          git push
