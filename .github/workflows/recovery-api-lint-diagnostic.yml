name: Recovery API lint diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/recovery-api-lint-diagnostic.yml

permissions:
  contents: read

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api generate
      - name: Apply safe lint fixes and print diff
        run: |
          pnpm --filter api exec eslint src/auth/auth.service.ts src/auth/auth.service.spec.ts src/auth/strategies/jwt.strategy.spec.ts --fix || true
          git diff -- services/api/src/auth/auth.service.ts services/api/src/auth/auth.service.spec.ts services/api/src/auth/strategies/jwt.strategy.spec.ts
