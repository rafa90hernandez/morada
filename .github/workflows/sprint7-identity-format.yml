name: Sprint 7 identity format

on:
  push:
    branches:
      - sprint7/mobile-identity-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7/mobile-identity-verification
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @morada/mobile exec prettier --write src/api/account.ts src/app/identity-verification.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/api/account.ts apps/mobile/src/app/identity-verification.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(mobile): format identity verification flow"
          git push origin HEAD:sprint7/mobile-identity-verification
