name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format mobile sources
        run: pnpm --filter @morada/mobile exec prettier --write "src/**/*.{ts,tsx}"

      - name: Commit formatting when changed
        run: |
          if git diff --quiet -- apps/mobile/src; then
            echo "Mobile sources already formatted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/src
            git commit -m "style(mobile): format discovery sources"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Run quality gates
        run: pnpm quality
