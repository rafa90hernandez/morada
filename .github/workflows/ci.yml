name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose mobile formatting
        shell: bash
        run: |
          pnpm --filter @morada/mobile exec prettier --write "src/**/*.{ts,tsx}" >/dev/null
          diff="$(git diff -- apps/mobile/src || true)"
          git checkout -- apps/mobile/src
          if [ -n "$diff" ]; then
            message="${diff//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Mobile Prettier diff::$message"
          fi

      - name: Run quality gates
        run: pnpm quality
