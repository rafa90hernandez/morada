name: Sprint 7 listing dependency

on:
  push:
    branches:
      - sprint7/mobile-listing-management

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7/mobile-listing-management
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @morada/mobile add expo-document-picker@~57.0.1
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(mobile): add Expo document picker"
          git push origin HEAD:sprint7/mobile-listing-management
