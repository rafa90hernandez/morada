name: Format discovery diagnostic

on:
  push:
    branches:
      - beta1/discovery-mobile-filters

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/mobile/src/features/discovery/DiscoveryScreen.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/features/discovery/DiscoveryScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(mobile): format discovery screen"
          git push
