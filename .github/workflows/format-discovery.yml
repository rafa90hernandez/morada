name: Format discovery diagnostic

on:
  push:
    branches:
      - beta1/discovery-mobile-filters

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier apps/mobile/src/features/discovery/DiscoveryScreen.tsx
