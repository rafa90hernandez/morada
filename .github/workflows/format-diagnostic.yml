name: Format diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/format-diagnostic.yml

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted client
        run: pnpm --filter @morada/mobile exec prettier src/api/client.ts
