name: Sprint 7 discovery type fix

on:
  push:
    branches:
      - sprint7/mobile-discovery-favorites

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprint7/mobile-discovery-favorites
      - name: Apply narrow TypeScript fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/app/index.tsx')
          text = path.read_text()
          old = '''                setSelected={setSort}\n                allowClear={false}'''
          new = '''                setSelected={(value) => {\n                  if (value) setSort(value);\n                }}\n                allowClear={false}'''
          if old not in text:
              raise SystemExit('Expected sort selector not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/app/index.tsx
          git commit -m "fix(mobile): keep sort selector non-nullable"
          git push origin HEAD:sprint7/mobile-discovery-favorites
